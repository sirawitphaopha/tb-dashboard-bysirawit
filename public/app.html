<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TB CARE & JOURNEY — รพ.ปรางค์กู่</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .tb-fade { animation: tbFadeIn 0.25s ease; }
    @keyframes tbFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .notif-modal { animation: notifExpand 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes notifExpand {
      from { opacity: 0; transform: scale(0.7) translateY(-20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes tbWiggle {
      0%, 100% { transform: translateX(0) scale(1); }
      15%  { transform: translateX(-3px) scale(1.04); }
      35%  { transform: translateX(3px)  scale(1.04); }
      55%  { transform: translateX(-2px) scale(1.02); }
      75%  { transform: translateX(2px)  scale(1.02); }
      90%  { transform: translateX(-1px) scale(1); }
    }
    .tb-wiggle:hover { animation: tbWiggle 0.45s ease; cursor: pointer; }
    @keyframes tbPulseBadge {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
      50%      { transform: scale(1.12); box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }
    .tb-pulse-badge { animation: tbPulseBadge 1.4s ease-in-out infinite; }
    .tb-dash-card {
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s cubic-bezier(0.34,1.56,0.64,1), border-color 0.15s ease;
    }
    .tb-dash-card:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 10px 28px rgba(13,148,136,0.15) !important;
      border-color: #2dd4bf !important;
    }
    .tb-pt-row {
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .tb-pt-row:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body class="bg-slate-100 overflow-hidden">
  <div id="root"></div>
  <script src="tb-data.js?v=30"></script>
  <script type="text/babel" src="tb-modals.jsx?v=30"></script>
  <script type="text/babel" src="tb-app.jsx?v=30"></script>
</body>
</html>
