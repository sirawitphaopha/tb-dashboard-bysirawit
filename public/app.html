<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TB JOURNEY & CARE — รพ.ปรางค์กู่</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .tb-fade { animation: tbFadeIn 0.25s ease; }
    @keyframes tbFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* ── Modal entrance animations (ลองทีละแบบ A-D) ── */
    .modal-A { animation: modalFadeScale 0.9s cubic-bezier(0.16,1,0.3,1); }
    @keyframes modalFadeScale {
      from { opacity: 0; transform: scale(0.96) translateY(35px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    /* ตอนปิด — ค่อยๆเฟดออก + เลื่อนลง (สมมาตรกับตอนเปิด) */
    .modal-A-out { animation: modalFadeScaleOut 0.6s cubic-bezier(0.4,0,1,1) forwards; }
    @keyframes modalFadeScaleOut {
      from { opacity: 1; transform: scale(1) translateY(0); }
      to   { opacity: 0; transform: scale(0.96) translateY(35px); }
    }
    .modal-overlay-out { animation: ovFadeOut 0.6s ease forwards; }
    @keyframes ovFadeOut { from { opacity: 1; } to { opacity: 0; } }
    /* fast variant — สำหรับ full-screen modal (ClinicalModal) ที่ปิดช้าจะรู้สึกหน่วง */
    .modal-A-out-fast        { animation: modalFadeScaleOut 0.25s ease forwards; }
    .modal-overlay-out-fast  { animation: ovFadeOut 0.25s ease forwards; }
    .modal-B { animation: modalSlideUp 0.34s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-C { animation: modalPop 0.42s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    .modal-D { animation: modalFadeOnly 0.3s ease; }
    @keyframes modalFadeOnly {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    /* Toast — slide-up เข้า, fade-up ออก (เร็วกว่า modal-A เหมาะกับ toast เด้งเตือน) */
    .modal-toast     { animation: modalToastIn  0.32s cubic-bezier(0.16,1,0.3,1); }
    .modal-toast-out { animation: modalToastOut 0.28s ease forwards; }
    @keyframes modalToastIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }
    @keyframes modalToastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-14px); }
    }
    .notif-modal { animation: notifExpand 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes notifExpand {
      from { opacity: 0; transform: scale(0.7) translateY(-20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes tbWiggle {
      0%, 100% { transform: translateX(0) scale(1); }
      15%  { transform: translateX(-3px) scale(1.04); }
      35%  { transform: translateX(3px)  scale(1.04); }
      55%  { transform: translateX(-2px) scale(1.02); }
      75%  { transform: translateX(2px)  scale(1.02); }
      90%  { transform: translateX(-1px) scale(1); }
    }
    .tb-wiggle:hover { animation: tbWiggle 0.45s ease; cursor: pointer; }
    @keyframes tbPulseBadge {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
      50%      { transform: scale(1.12); box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }
    .tb-pulse-badge { animation: tbPulseBadge 1.4s ease-in-out infinite; }
    .tb-dash-card {
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s cubic-bezier(0.34,1.56,0.64,1), border-color 0.15s ease;
    }
    .tb-dash-card:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 10px 28px rgba(13,148,136,0.15) !important;
      border-color: #2dd4bf !important;
    }
    .tb-pt-row {
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .tb-pt-row:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body class="bg-slate-100 overflow-hidden">
  <div id="root"></div>
  <script src="tb-data.js?v=39"></script>
  <script type="text/babel" src="tb-modals.jsx?v=39"></script>
  <script type="text/babel" src="tb-app.jsx?v=39"></script>
</body>
</html>
